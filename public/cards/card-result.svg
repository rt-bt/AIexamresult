<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 448" width="576" height="448" fill="none">
  <defs>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Document Card Background -->
  <rect x="12" y="12" width="552" height="424" rx="16" fill="url(#bgGrad1)" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow1)" />

  <!-- Header Banner -->
  <path d="M14 28 C14 20.268 20.268 14 28 14 L548 14 C555.732 14 562 20.268 562 28 L562 90 L14 90 Z" fill="url(#headerGrad1)" />

  <!-- Header Content -->
  <circle cx="50" cy="52" r="20" fill="#FFFFFF" fill-opacity="0.2" />
  <circle cx="50" cy="52" r="12" fill="#FFFFFF" />
  <path d="M44 52 L48 56 L56 48" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="82" y="46" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">OFFICIAL SCORECARD 2026</text>
  <text x="82" y="66" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Government Exam Result &amp; Merit List</text>

