  <!-- Document Body Grid -->
  <rect x="36" y="112" width="504" height="60" rx="10" fill="#F1F5F9" />
  <text x="56" y="136" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">CANDIDATE ROLL NUMBER</text>
  <text x="56" y="156" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" font-family="monospace">2408910482</text>

  <text x="320" y="136" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PERCENTILE SCORE</text>
  <text x="320" y="157" fill="#0D9488" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900">99.42 %</text>

  <!-- Subject Breakdown -->
  <rect x="36" y="190" width="504" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Row 1 -->
  <text x="56" y="222" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">General Intelligence &amp; Reasoning</text>
  <rect x="360" y="212" width="130" height="10" rx="5" fill="#E2E8F0" />
  <rect x="360" y="212" width="118" height="10" rx="5" fill="#0D9488" />
  <text x="502" y="222" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">48/50</text>

  <line x1="36" y1="240" x2="540" y2="240" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Row 2 -->
  <text x="56" y="272" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Quantitative Aptitude</text>
  <rect x="360" y="262" width="130" height="10" rx="5" fill="#E2E8F0" />
  <rect x="360" y="262" width="122" height="10" rx="5" fill="#0D9488" />
  <text x="502" y="272" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">49/50</text>

  <line x1="36" y1="290" x2="540" y2="290" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Row 3 -->
  <text x="56" y="322" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">English Language &amp; Comprehension</text>
  <rect x="360" y="312" width="130" height="10" rx="5" fill="#E2E8F0" />
  <rect x="360" y="312" width="112" height="10" rx="5" fill="#0D9488" />
  <text x="502" y="322" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">46/50</text>

  <!-- Footer Seal Badge -->
  <rect x="36" y="360" width="504" height="52" rx="10" fill="#CCFBF1" fill-opacity="0.5" stroke="#99F6E4" stroke-width="1" />
  <circle cx="62" cy="386" r="14" fill="#0D9488" />
  <text x="62" y="391" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">✓</text>
  <text x="88" y="382" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">ALL INDIA MERIT RANK #142</text>
  <text x="88" y="398" fill="#115E59" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Document Verification Call Letter Issued</text>
