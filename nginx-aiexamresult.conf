server {
    listen 80;
    server_name aiexamresult.com www.aiexamresult.com;
    return 301 https://www.aiexamresult.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.aiexamresult.com aiexamresult.com;

    ssl_certificate /etc/letsencrypt/live/www.aiexamresult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiexamresult.com/privkey.pem;

    if ($host = aiexamresult.com) {
        return 301 https://www.aiexamresult.com$request_uri;
    }

    location /_next/static {
        alias /home/ubuntu/a-iexamresult/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        alias /home/ubuntu/a-iexamresult/public;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}
