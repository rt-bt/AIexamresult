server {
    listen 80;
    server_name aiexamresult.com www.aiexamresult.com;
    return 301 https://www.aiexamresult.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.aiexamresult.com aiexamresult.com;

    ssl_certificate /etc/letsencrypt/live/www.aiexamresult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiexamresult.com/privkey.pem;

    if ($host = aiexamresult.com) {
        return 301 https://www.aiexamresult.com$request_uri;
    }

    # ============================================
    # GZIP COMPRESSION — Grade F(0) Fix
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ============================================
    # STATIC ASSETS — Expires Headers Fix (Grade C → A)
    # ============================================

    # Next.js build output — immutable, cache forever
    location /_next/static {
        alias /home/ubuntu/a-iexamresult/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files (images, icons, SVGs, manifests)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot|css|js|json|xml|txt|webmanifest)$ {
        root /home/ubuntu/a-iexamresult/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Fallback to Next.js for dynamic routes
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}
