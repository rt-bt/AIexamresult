name: Deploy to EC2
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Compress .next
        run: zip -r .next.zip .next/ -x ".next/cache/**"

      - name: Upload data files to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        run: |
          aws s3 cp data/scraped.json s3://aiexamresult-data/scraped.json --quiet
          aws s3 sync data/posts/ s3://aiexamresult-data/posts/ --exclude "*" --include "*.json" --quiet

      - name: Upload .next to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 65.0.146.40
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".next.zip"
          target: /home/ubuntu/a-iexamresult

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 65.0.146.40
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/a-iexamresult
            git pull origin master
            npm ci --omit=dev
            sudo rm -rf .next
            unzip -q .next.zip -d .next
            rm -f .next.zip
            sudo chown -R ubuntu:ubuntu .next
            sudo chmod -R 755 .next
            # Pull latest data from S3 (public bucket)
            curl -s -o data/scraped.json https://aiexamresult-data.s3.ap-south-1.amazonaws.com/scraped.json
            pm2 restart aiexamresult --update-env
            pm2 save
