name: Sync SarkariResult
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      - name: Run sync-sarkariresult
        run: node scripts/sync-sarkariresult.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "sarkariresult-bot"
          git config user.email "rtbtrack@gmail.com"
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Sync sarkariresult $(date +'%d %b %Y %H:%M')"
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Send push notifications
        if: always()
        env:
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
        run: |
          curl -s -X POST https://www.aiexamresult.com/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-api-key: $PUSH_API_KEY" \
            -d '{"title":"New Update on AI Exam Result","body":"Latest govt job updates are now available","url":"https://www.aiexamresult.com"}'
