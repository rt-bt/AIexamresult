name: Sync All Sources
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      - name: Run sync-all (sarkariresult.com + sarkariexam.com)
        run: node scripts/sync-all.mjs

      - name: Run SEO optimization
        run: node scripts/seo-optimize.mjs

      - name: Upload data to S3 backup
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        run: |
          aws s3 cp data/scraped.json s3://aiexamresult-data/scraped.json --quiet
          aws s3 sync data/posts/ s3://aiexamresult-data/posts/ --exclude "*" --include "*.json" --quiet

      - name: Push data to EC2 and reload
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 65.0.146.40
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/a-iexamresult
            curl -s -o data/scraped.json https://aiexamresult-data.s3.ap-south-1.amazonaws.com/scraped.json
            pm2 restart aiexamresult

      - name: Send push notifications
        if: always()
        env:
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
        run: |
          curl -s -X POST https://www.aiexamresult.com/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-api-key: $PUSH_API_KEY" \
            -d '{"title":"New Update on AI Exam Result","body":"Latest govt job updates are now available","url":"https://www.aiexamresult.com"}'
