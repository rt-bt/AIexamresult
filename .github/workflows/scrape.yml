name: Auto-Scrape
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run scrape || echo "Scrape completed with some errors"
      - run: node scripts/seo-optimize.mjs || echo "SEO optimization skipped"
      - name: Commit & push if changed
        run: |
          git config user.name "Aditya"
          git config user.email "rtbtrack@gmail.com"
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto scrape $(date +'%d %b %Y %H:%M')"
            git push
          fi
