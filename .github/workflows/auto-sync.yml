name: Auto Sync Data Every 2 Hours

on:
  schedule:
    # Runs every 2 hours (at minute 0)
    - cron: '0 */2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run data sync (scrape latest posts)
        run: node scripts/sync-sarkariexam-only.mjs
        timeout-minutes: 8
        continue-on-error: false

      - name: Run SEO optimization
        run: node scripts/seo-optimize.mjs
        timeout-minutes: 3
        continue-on-error: true

      - name: Check if data changed
        id: check_changes
        run: |
          git diff --quiet data/scraped.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/scraped.json data/scraped-data.ts
          git commit -m "chore: auto-sync data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "No new data found, skipping push."
